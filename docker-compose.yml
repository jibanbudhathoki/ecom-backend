version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: ecom-postgres
    environment:
      POSTGRES_DB: ecom
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: change_me
    ports:
      - "5432:5432"
    volumes:
      - ecom-postgres-data:/var/lib/postgresql/data

volumes:
  ecom-postgres-data:
